name: CI - Production

on:
  # מריץ את ה-Workflow בכל push לענף main
  push:
    branches:
      - main

  # מריץ בדיקות לפני שמאשרים Pull Request לתוך main
  pull_request:
    branches:
      - main

  # מאפשר להריץ את ה-Workflow ידנית דרך GitHub Actions
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # מוריד את קוד הפרויקט אל ה-GitHub Runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # מתקין Java 21 ושומר את Maven dependencies ב-cache
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # מבצע clean, מקמפל את הפרויקט, מריץ בדיקות ויוצר את קובץ ה-JAR
      - name: Build and test
        run: mvn --batch-mode clean verify

