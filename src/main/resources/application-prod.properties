app.environment=prod
server.port=8083
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8083}

# Structured JSON console output for machine-parseable production logs (built into Spring Boot)
logging.structured.format.console=ecs

spring.datasource.url=${DB_URL:jdbc:postgresql://bookstore-prod-db:5432/bookstore_db}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
