spring.application.name=bookstore
spring.profiles.active=${APP_PROFILE:local}

app.environment=local
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.flyway.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookstore_db}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Correlation id (set by RequestLoggingFilter) surfaced next to the log level in every line
logging.pattern.correlation=[requestId=%X{requestId:-none}]

logging.level.root=INFO
logging.level.com.alon.bookstore=INFO