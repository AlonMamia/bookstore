spring.application.name=bookstore
spring.profiles.active=${APP_PROFILE:local}

app.environment=local
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.flyway.enabled=true
# Schema Flyway migrates and Hibernate validates against. Defaults to "public" so local/dev/compose
# are unaffected; RDS-backed environments set DB_SCHEMA to isolate pp/prod on one shared instance.
spring.flyway.schemas=${DB_SCHEMA:public}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookstore_db}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Health check surfaced for container/ALB probes; kept under /api so it needs no separate routing rule.
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Correlation id (set by RequestLoggingFilter) surfaced next to the log level in every line
logging.pattern.correlation=[requestId=%X{requestId:-none}]

logging.level.root=INFO
logging.level.com.alon.bookstore=INFO